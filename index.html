<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111914" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const theme = localStorage.getItem('gather-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {
        // Use the system theme when browser storage is unavailable.
      }
    </script>
    <meta
      name="description"
      content="Gather your party. A shared tabletop for stories worth coming back to."
    />
    <title>Gather — your next chapter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
